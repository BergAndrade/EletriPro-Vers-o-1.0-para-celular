<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="EletriPro — calculadora elétrica e orçamentos para profissionais.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <title>EletriPro | Calculadora do Eletricista</title>
  <style>
    :root { --bg:#090c0e; --bg2:#11161a; --card:#151c20; --card2:#1b2429; --line:#2b353b; --sub:#94a3ad; --muted:#6f7c84; --txt:#f6f8f8; --accent:#ffbe26; --accent2:#efaa08; --good:#36d389; --bad:#ff7474; --r:17px; color-scheme:dark; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { background:var(--bg); color:var(--txt); margin:0; font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible, input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .app { max-width:1020px; margin:auto; min-height:100dvh; padding:0 22px 108px; }
    .header { display:flex; align-items:center; justify-content:space-between; height:80px; border-bottom:1px solid rgba(255,255,255,.06); gap:12px; }
    .brand { display:flex; align-items:center; gap:9px; color:var(--txt); background:none; border:0; padding:0; text-align:left; }
    .mark { width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#ffcf52,#f8ad00);color:#111; box-shadow:0 3px 15px #ffbe2622; }
    .mark svg { width:24px;height:24px; fill:currentColor;stroke:none; }
    .brand-name {font-size:22px;font-weight:830;letter-spacing:-1px;line-height:1.05;}
    .brand-name span { color:var(--accent); }
    .brand small { display:block;font-size:9px;color:var(--sub);letter-spacing:.4px;font-weight:500;margin-top:3px; }
    .tag { font-size:11px;color:var(--accent);border:1px solid #765a20;background:#201b0f;border-radius:999px;padding:6px 10px;font-weight:800;white-space:nowrap; }
    .header-actions {display:flex;align-items:center;gap:9px;}
    .icon-btn {border:1px solid var(--line);background:var(--card);border-radius:12px;width:38px;height:38px;color:var(--txt);display:grid;place-items:center;}
    svg.ic {width:21px;height:21px;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.85;flex:none;}
    .screen { padding-top:26px; animation:fade .18s ease-out; }
    @keyframes fade {from { opacity:.65;transform:translateY(4px) }to {opacity:1;transform:none}}
    h1,h2,h3,p {margin-top:0;}
    h1 {font-size:clamp(26px,4vw,35px);line-height:1.17;letter-spacing:-1.2px;margin-bottom:8px;}
    h2 {font-size:21px;line-height:1.25;letter-spacing:-.5px;margin-bottom:6px;}
    h3 {font-size:15px;line-height:1.2;margin-bottom:8px;}
    .eyebrow {color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1.6px;font-weight:850;margin:0 0 10px;}
    .sub {color:var(--sub);font-size:13px;line-height:1.55;}
    .hero { background:radial-gradient(circle at 91% 5%, #4c391440 0%,transparent 40%),linear-gradient(130deg,#1b2223,#101518);border:1px solid #30383b;border-radius:22px;padding:25px 23px 21px;position:relative;overflow:hidden; }
    .hero:after {content:'ϟ';font-size:180px;position:absolute;right:12px;top:-51px;color:#ffc6390e;font-weight:900;transform:rotate(-8deg);pointer-events:none;}
    .hero > *{position:relative;z-index:1;}
    .hero h1 span {color:var(--accent);}
    .hero p {color:#afbabd;max-width:490px;margin:0 0 20px;}
    .primary {background:linear-gradient(180deg,#ffcf50,#ffb719); color:#16120a;border:0;border-radius:12px;min-height:48px;font-weight:850;padding:11px 17px;display:inline-flex;justify-content:center;align-items:center;gap:9px;box-shadow:0 4px 14px #ffbd2520;}
    .primary:active,.secondary:active,.tile:active {transform:scale(.99);}
    .secondary {background:var(--card2);color:var(--txt);border:1px solid #37434a;border-radius:12px;min-height:44px;padding:10px 15px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
    .ghost {background:transparent;border:0;color:var(--sub);padding:7px 4px;display:inline-flex;gap:6px;align-items:center;}
    .row-between {display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .section-heading {margin:28px 0 13px;display:flex;align-items:end;justify-content:space-between;}
    .section-heading h2 {font-size:19px;margin:0;}
    .tools {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
    .tile {text-align:left;min-height:148px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,#1a2226,#12181b);padding:18px 14px 15px;color:var(--txt);display:flex;flex-direction:column;align-items:flex-start;gap:8px;transition:border .15s ease;}
    .tile:hover {border-color:#ad8432;}
    .tile .tile-icon {width:42px;height:42px;border-radius:11px;background:#302916;color:var(--accent);display:grid;place-items:center;margin-bottom:4px;}
    .tile .tile-icon svg{width:23px;height:23px;}
    .tile strong{font-size:14px;line-height:1.2;}
    .tile small {font-size:11px;color:var(--sub);line-height:1.4;}
    .stats {display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
    .stat {border:1px solid var(--line);border-radius:13px;padding:15px 11px;background:#12181b;}
    .stat b{display:block;font-size:22px;color:var(--accent);line-height:1.1;}
    .stat span{display:block;color:var(--sub);font-size:11px;margin-top:7px;}
    .page-title {display:flex;align-items:flex-start;gap:11px;margin-bottom:19px;}
    .back {border:1px solid var(--line);color:var(--txt);background:var(--card);width:37px;height:37px;border-radius:11px;display:grid;place-items:center;flex:none;margin-top:1px;}
    .page-title h1 {font-size:24px;letter-spacing:-.7px;margin:0 0 4px;}
    .page-title p{color:var(--sub);font-size:12px;margin:0;}
    .surface {background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:19px;}
    .surface+.surface {margin-top:13px;}
    .grid-form {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
    label.field {display:block;font-size:12px;font-weight:700;color:#c9d3d7;}
    .field>span {display:block;margin-bottom:7px;}
    .field input,.field select,.field textarea {width:100%;min-height:46px;border:1px solid #354149;background:#0e1316;color:var(--txt);border-radius:10px;padding:11px 12px;font-size:15px;outline-offset:0;}
    .field input::placeholder,.field textarea::placeholder{color:#69787f;}
    .field textarea {resize:vertical;min-height:85px;}
    .field select {padding-right:16px;}
    .full {grid-column:1 / -1;}
    .seg {background:#101619;border:1px solid #303c40;padding:4px;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:16px;}
    .seg button {font-size:12px;background:none;color:var(--sub);border:0;border-radius:9px;padding:12px 3px;font-weight:750;}
    .seg button.active {background:var(--accent);color:#151309;box-shadow:0 2px 7px #0007;}
    .hint {font-size:11px;color:var(--sub);line-height:1.6;margin:10px 0 0;}
    .info {padding:13px 14px;border-radius:12px;background:#262318;border:1px solid #584723;color:#e7d7ac;font-size:12px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
    .info svg {color:var(--accent);width:18px;height:18px;}
    .info.neutral {color:#c5d3db;background:#172229;border-color:#29404c;}
    .form-actions{margin-top:17px;display:flex;gap:9px;flex-wrap:wrap;}
    .form-actions>.primary{flex:1;}
    .result {margin-top:16px;border:1px solid #225945;background:linear-gradient(160deg,#13281f,#10201a);border-radius:var(--r);padding:19px;}
    .result-head {display:flex;align-items:center;gap:9px;font-weight:850;color:var(--good);margin-bottom:16px;}
    .result-main {display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
    .kpi {border:1px solid #31513f;border-radius:12px;padding:14px;background:#10231a;min-width:0;}
    .kpi span{display:block;color:#b4cec0;font-size:11px;margin-bottom:6px;}
    .kpi b {font-size:clamp(20px,4vw,28px);line-height:1.1;display:block;word-break:break-word;}
    .kpi b.green{color:var(--good);}
    .kpi b.gold{color:var(--accent);}
    .result-details {border-top:1px solid #305344;margin-top:15px;padding-top:12px;}
    .detail-line{display:flex;justify-content:space-between;gap:14px;padding:6px 0;color:#b4c6be;font-size:12px;}
    .detail-line strong{text-align:right;color:var(--txt);}
    .result .buttons {display:flex;gap:8px;margin-top:15px;flex-wrap:wrap;}
    .result .buttons button{flex:1;}
    .warning {margin-top:14px;border:1px solid #684e26;border-radius:12px;padding:12px 13px;background:#292015;color:#f5d4a4;font-size:11px;line-height:1.55;}
    .bad-card {margin-top:16px;border:1px solid #693a3a;border-radius:14px;background:#291a1c;color:#ffc7c7;padding:16px;}
    .history-card {display:flex;align-items:flex-start;gap:10px;justify-content:space-between; border:1px solid var(--line);background:var(--card);padding:15px;border-radius:14px;margin-bottom:10px;}
    .history-card strong {font-size:13px;display:block;}
    .history-card span {color:var(--sub);font-size:11px;display:block;margin:4px 0;}
    .history-card b {color:var(--accent);font-size:13px;}
    .history-actions{display:flex;align-items:center;gap:6px;}
    .tiny-btn {border:1px solid var(--line);background:#1d282e;color:#d7e2e6;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:800;}
    .tiny-btn.danger{color:#ffa1a1;}
    .empty{text-align:center;padding:35px 25px;border:1px dashed #3b464b;background:#10171a;border-radius:17px;color:var(--sub);}
    .empty .large {font-size:34px;display:block;margin-bottom:8px;}
    .quote-line {display:grid;grid-template-columns:minmax(0,1fr) 48px 80px auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #30393e;font-size:12px;}
    .quote-line:last-child {border-bottom:0;}
    .quote-line strong{display:block;overflow-wrap:anywhere;}
    .quote-line small {display:block;color:var(--sub);margin-top:2px;font-size:10px;}
    .quote-line span{text-align:right;white-space:nowrap;}
    .quote-delete{width:30px;height:32px;border:0;background:#382224;color:#ffaaa9;border-radius:8px;display:grid;place-items:center;}
    .quote-total{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #3c4649;padding-top:14px;margin-top:13px;font-weight:800;}
    .quote-total strong{font-size:24px;color:var(--accent);}
    .note-row{display:flex;align-items:flex-start;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);}
    .note-row:last-child{border-bottom:0;}
    .note-row>.note-icon{width:37px;height:37px;display:grid;place-items:center;color:var(--accent);background:#292415;border-radius:10px;flex:none;}
    .note-row h3 {margin:0 0 4px;font-size:14px;}
    .note-row p {font-size:12px;color:var(--sub);margin:0;line-height:1.6;}
    .bottom {z-index:10; position:fixed;left:0;right:0;bottom:0;background:#0d1215f5;backdrop-filter:blur(14px);border-top:1px solid #2b3438;padding:6px max(12px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;max-width:1020px;margin:auto;}
    .nav {color:#8b989e;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;min-width:65px;min-height:54px;padding:5px 8px;border-radius:12px;}
    .nav.active {color:var(--accent);background:#30271655;font-weight:800;}
    .nav svg{width:22px;height:22px;}
    .toast {position:fixed;z-index:30;bottom:86px;left:50%;transform:translateX(-50%);max-width:calc(100% - 26px);min-width:220px;border:1px solid #47624e;color:#ecf9ef;background:#1d3529;padding:12px 16px;border-radius:12px;font-size:12px;text-align:center;box-shadow:0 12px 38px #0009;display:none;}
    .toast.show {display:block;}
    .hide {display:none!important;}
    #printSheet {display:none;}
    @media(min-width:710px){ .app{padding:0 32px 110px;} .screen{max-width:860px;margin:auto;} .tools{grid-template-columns:repeat(4,minmax(0,1fr));} .tile{min-height:178px;} .hero{padding:32px;} .grid-form{gap:16px;} .surface{padding:23px;} .bottom{width:fit-content;left:50%;right:auto;transform:translateX(-50%);bottom:15px;max-width:none;border:1px solid #3a464a;border-radius:22px;padding:5px 14px;box-shadow:0 8px 35px #0009;} .nav{min-width:100px;} }
    @media(max-width:380px){.app{padding-left:15px;padding-right:15px;}.tile{padding:14px 11px;}.quote-line{grid-template-columns:minmax(0,1fr) 36px 69px auto;gap:6px;}.quote-line span{font-size:11px;}}
    @media print{ @page{size:A4;margin:15mm;} body{background:#fff!important;color:#111!important;font:11pt/1.45 Arial,sans-serif;} body>.app,body>.bottom,body>.toast{display:none!important;} #printSheet{display:block!important;color:#111!important;} .ps-head{border-bottom:3px solid #e5ab17;padding-bottom:14px;margin-bottom:16px;} .ps-head h1{font-size:26px;letter-spacing:-.4px;color:#1f252a;} .ps-meta{display:flex;justify-content:space-between;gap:30px;margin-bottom:20px;font-size:10pt;} .ps-table{width:100%;border-collapse:collapse;margin-top:20px;} .ps-table th,.ps-table td{border-bottom:1px solid #ccc;padding:10px 6px;text-align:left;font-size:9.5pt;} .ps-table th{background:#f1f1f1;} .ps-total{text-align:right;font-size:17pt;font-weight:bold;padding:16px 3px;border-top:2px solid #222;margin-top:12px;} .ps-foot{margin-top:35px;font-size:9pt;color:#555;} }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="brand" type="button" data-go="home" aria-label="Ir para início"><span class="mark"><svg viewBox="0 0 24 24"><path d="M14.7 1 4.8 13.3h6.6L9.5 23 20 9.8h-6.6L14.7 1Z"/></svg></span><span><span class="brand-name">Eletri<span>Pro</span></span><small>CALCULADORA DO ELETRICISTA</small></span></button>
      <div class="header-actions"><span class="tag">BETA 1.0</span><button class="icon-btn" type="button" data-go="settings" aria-label="Configurações" title="Configurações"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.05.05-2.83 2.83-.05-.05a1.8 1.8 0 0 0-1.98-.36l-1.1.46V22h-4v-2.09l-1.1-.46a1.8 1.8 0 0 0-1.98.36l-.05.05-2.83-2.83.05-.05A1.8 1.8 0 0 0 4.3 15l-.45-1.1H2v-4h1.85L4.3 8.8a1.8 1.8 0 0 0-.36-1.98l-.05-.05 2.83-2.83.05.05a1.8 1.8 0 0 0 1.98.36l1.1-.46V2h4v1.89l1.1.46a1.8 1.8 0 0 0 1.98-.36l.05-.05 2.83 2.83-.05.05a1.8 1.8 0 0 0-.36 1.98l.45 1.1H22v4h-1.85Z" transform="translate(0 0) scale(1)"/></svg></button></div>
    </header>
    <main id="screen" class="screen"></main>
  </div>
  <nav class="bottom" aria-label="Menu principal" id="bottomNav"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <section id="printSheet" aria-label="Orçamento para impressão"></section>
  <input id="importBackup" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
// EletriPro beta: cálculos indicativos, com hipóteses declaradas ao usuário.
// Não há backend, autenticação, cobrança ou sincronização nesta versão.
const STORE = 'eletripro_beta_v1';
const SECTIONS = [1.5,2.5,4,6,10,16,25,35,50,70,95];
// Valores de referência simplificados: cobre, PVC 70°C, método B1, 2/3 condutores carregados.
// A aplicação final requer consulta às tabelas, correções e critérios normativos pertinentes.
const AMP_B1 = {
  2:[17.5,24,32,41,57,76,101,125,151,192,232],
  3:[15.5,21,28,36,50,68,89,110,134,171,207]
};
const BREAKERS = [6,10,16,20,25,32,40,50,63,80,100,125,160,200];
const DEFAULTS = {
  profile:'Residencial',
  circuit:{kind:'tomadas',name:'Circuito de tomadas',power:'3000',voltage:'220',length:'15',phase:'bi',pf:'1',temp:'1',group:'1'},
  cable:{current:'25',loaded:'2',temp:'1',group:'1',kind:'tomadas'},
  drop:{current:'23',voltage:'220',length:'20',section:'4',phase:'bi'},
  quote:{professional:'',client:'',contact:'',location:'',notes:'Validade do orçamento: 15 dias.',items:[]},
  history:[]
};
const copy = x => JSON.parse(JSON.stringify(x));
function loadState(){try{let x=JSON.parse(localStorage.getItem(STORE));if(!x||typeof x!=='object')return copy(DEFAULTS);return {...copy(DEFAULTS),...x,circuit:{...DEFAULTS.circuit,...(x.circuit||{})},cable:{...DEFAULTS.cable,...(x.cable||{})},drop:{...DEFAULTS.drop,...(x.drop||{})},quote:{...DEFAULTS.quote,...(x.quote||{}),items:Array.isArray(x.quote?.items)?x.quote.items:[]},history:Array.isArray(x.history)?x.history.slice(0,70):[]};}catch{return copy(DEFAULTS);}}
let state=loadState(),page='home',latest=null,latestCable=null,latestDrop=null;
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const num=(v)=>{if(typeof v==='number')return v;return Number(String(v??'').trim().replace(',','.'));};
const fmt=(n,d=1)=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const safe=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));return true;}catch{toast('Armazenamento indisponível: exporte o backup.');return false;}}
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2m4 0h2M8 15h2m4 0h2M8 19h2m4 0h2"/>',quote:'<path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8l-5-5H8Z"/><path d="M15 3v6h6M7 14h10M7 18h8"/>',history:'<path d="M3 12a9 9 0 1 0 2.5-6.2L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',bolt:'<path d="m13 2-9 11h7l-1 9 10-12h-7l1-8Z"/>',cable:'<path d="M4 7h9l4 4v6M4 11h7l2 2v4M4 15h5v2M17 17v4M13 17v4M9 17v4"/>',drop:'<path d="M3 19h18M5 15l5-6 4 3 5-7M15 5h4v4"/>',shield:'<path d="M12 2 4 5v6c0 5 3 9 8 11 5-2 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/>',back:'<path d="m15 18-6-6 6-6"/>',check:'<path d="M20 6 9 17l-5-5"/>',add:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6M10 10v7M14 10v7"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',alert:'<path d="M12 3 2 21h20L12 3ZM12 9v5m0 4h.01"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',save:'<path d="M4 3h13l3 3v15H4zM8 3v6h8V3M8 21v-9h8v9"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v6m0-10h.01"/>',printer:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6zM18 12h.01"/>',pencil:'<path d="M12 20h9M4 20l4-.8L20 7a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/>',filter:'<path d="M4 7h16M7 12h10M10 17h4"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
const ic=(k)=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${icons[k]||icons.info}</svg>`;
function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3100);}
function title(t,desc){return `<div class="page-title"><button class="back" type="button" data-go="home" aria-label="Voltar">${ic('back')}</button><div><h1>${safe(t)}</h1><p>${safe(desc)}</p></div></div>`;}
function fld(label,name,value,opts={}){let body='',extra=opts.attr||'',place=safe(opts.placeholder||'');if(opts.options){body=`<select name="${name}" ${extra}>${opts.options.map(a=>`<option value="${safe(a[0])}" ${String(value)===String(a[0])?'selected':''}>${safe(a[1])}</option>`).join('')}</select>`;}else if(opts.textarea){body=`<textarea name="${name}" placeholder="${place}" ${extra}>${safe(value)}</textarea>`;}else{body=`<input name="${name}" type="${opts.type||'text'}" value="${safe(value)}" placeholder="${place}" ${extra}>`;}return `<label class="field ${opts.full?'full':''}"><span>${safe(label)}</span>${body}</label>`;}
function info(msg,kind=''){return `<div class="info ${kind}">${ic('info')}<div>${msg}</div></div>`;}
function renderNav(){const entries=[['home','Início','home'],['circuit','Calcular','calc'],['quote','Orçamento','quote'],['history','Histórico','history']];document.getElementById('bottomNav').innerHTML=entries.map(([p,label,icon])=>`<button type="button" class="nav ${(page===p||(p==='circuit'&&['cable','drop'].includes(page)))?'active':''}" data-go="${p}" aria-label="${label}">${ic(icon)}<span>${label}</span></button>`).join('');}
function home(){const entries=[['circuit','bolt','Dimensionar circuitos','Corrente, cabo e proteção'],['cable','cable','Seção de cabos','Método B1 e correções'],['drop','drop','Queda de tensão','Estimativa por comprimento'],['protections','shield','Disjuntores e DPS','Orientações de proteção'],['quote','quote','Orçamentos em PDF','Materiais e mão de obra'],['history','history','Histórico de cálculos','Acesse o que foi salvo']];return `<section class="hero"><div class="eyebrow">Ferramentas elétricas na palma da mão</div><h1>Seu trabalho mais <span>rápido.</span><br>Seu projeto mais organizado.</h1><p>Pré-dimensionamento de circuitos, verificações elétricas e orçamentos profissionais para levar ao cliente.</p><button type="button" data-go="circuit" class="primary">${ic('bolt')} Começar cálculo</button></section><div class="stats"><div class="stat"><b>${state.history.length}</b><span>Cálculos salvos</span></div><div class="stat"><b>${state.quote.items.length}</b><span>Itens no orçamento</span></div><div class="stat"><b>100%</b><span>Uso local nesta versão</span></div></div><div class="section-heading"><h2>Ferramentas</h2><span class="sub">Selecione uma opção</span></div><div class="tools">${entries.map(a=>`<button class="tile" data-go="${a[0]}"><span class="tile-icon">${ic(a[1])}</span><strong>${a[2]}</strong><small>${a[3]}</small></button>`).join('')}</div><div style="margin-top:18px">${info('<strong>Versão beta:</strong> os cálculos são indicativos e precisam de validação técnica. O app não substitui projeto elétrico, medições ou normas aplicáveis.','neutral')}</div>`;}
function profileBlock(){return `<div class="seg" aria-label="Tipo de instalação">${['Residencial','Comercial','Industrial'].map(x=>`<button data-profile="${x}" class="${state.profile===x?'active':''}" type="button">${x}</button>`).join('')}</div>`;}
function circuitPage(){const c=state.circuit;return `${title('Dimensionar circuitos','Estimativa de seção, corrente e proteção')}<div class="surface">${profileBlock()}<form id="circuitForm" autocomplete="off"><div class="grid-form">${fld('Identificação do circuito','name',c.name,{full:true,placeholder:'Ex.: Tomadas da cozinha',attr:'data-model="circuit" maxlength="100" required'})}${fld('Aplicação','kind',c.kind,{full:true,attr:'data-model="circuit"',options:[['iluminacao','Iluminação'],['tomadas','Tomadas / força'],['equipamento','Equipamento dedicado']]})}${fld('Potência ativa (W)','power',c.power,{type:'number',attr:'data-model="circuit" min="1" max="1000000" step="any" required'})}${fld('Tensão (V)','voltage',c.voltage,{type:'number',attr:'data-model="circuit" min="1" max="1000" step="any" required'})}${fld('Alimentação','phase',c.phase,{full:true,attr:'data-model="circuit"',options:[['mono','Monofásico (F + N)'],['bi','Bifásico (F + F)'],['tri','Trifásico (3F)']]})}${fld('Comprimento de ida (m)','length',c.length,{type:'number',attr:'data-model="circuit" min="0.1" max="100000" step="any" required'})}${fld('Fator de potência','pf',c.pf,{type:'number',attr:'data-model="circuit" min="0.01" max="1" step="0.01" required'})}${fld('Fator de temperatura','temp',c.temp,{type:'number',attr:'data-model="circuit" min="0.1" max="1" step="0.01" required'})}${fld('Fator de agrupamento','group',c.group,{type:'number',attr:'data-model="circuit" min="0.1" max="1" step="0.01" required'})}</div><p class="hint">Modelo: cobre, isolamento PVC 70 °C, método B1; fatores de correção devem ser informados após verificação das condições reais. Em trifásico, informar tensão entre fases e potência ativa total equilibrada.</p><div class="form-actions"><button type="submit" class="primary">${ic('calc')} Calcular circuito</button></div></form></div>${latest?.type==='circuit'?renderCircuitResult(latest):''}`;}
function condition(){return 'Condutor de cobre, isolação PVC 70 °C, método B1, circuitos de baixa tensão, carga equilibrada em trifásico.';}
function validateFactors(temp,group){return temp>0&&temp<=1&&group>0&&group<=1;}
function getAmp(section,loaded){let ix=SECTIONS.indexOf(section);return ix<0?0:AMP_B1[loaded][ix];}
function standardBreaker(current,iz){return BREAKERS.find(b=>b+1e-9>=current&&b<=iz+1e-9)||null;}
function dropFor(ib,V,L,S,phase){const rho=0.0225;const factor=phase==='tri'?Math.sqrt(3):2;const volts=factor*ib*rho*L/S;return {volts,pct:volts*100/V};}
function calcCircuit(c){let P=num(c.power),V=num(c.voltage),L=num(c.length),pf=num(c.pf),temp=num(c.temp),group=num(c.group);if(![P,V,L,pf,temp,group].every(Number.isFinite)||P<=0||V<=0||L<=0||pf<=0||pf>1||V>1000||!validateFactors(temp,group))return {error:'Confira potência, tensão, comprimento e fatores (0 a 1).'};let ph=['mono','bi','tri'].includes(c.phase)?c.phase:'bi';let Ib=P/((ph==='tri'?Math.sqrt(3):1)*V*pf);if(Ib<=0||!Number.isFinite(Ib))return {error:'Não foi possível calcular a corrente.'};let n=ph==='tri'?3:2,minimum=c.kind==='iluminacao'?1.5:2.5;let match=null;for(let s of SECTIONS.filter(s=>s>=minimum)){let izRef=getAmp(s,n),iz=izRef*temp*group,d=dropFor(Ib,V,L,s,ph),br=standardBreaker(Ib,iz);if(Ib<=iz && d.pct<=4 && br){match={section:s,izRef,iz,drop:d,breaker:br};break;}}
return {type:'circuit',ib:Ib,matched:match,phase:ph,profile:state.profile,loaded:n,inputs:copy(c),power:P,voltage:V,minimum,temp,group,date:new Date().toISOString()};}
function renderCircuitResult(r){if(r.error)return `<div class="bad-card">${ic('alert')} ${safe(r.error)}</div>`;if(!r.matched)return `<div class="bad-card"><strong>Não foi encontrada combinação válida na tabela interna.</strong><p style="margin:8px 0 0;font-size:12px">Corrente estimada: ${fmt(r.ib,2)} A. Revise dados, método de instalação e projeto. Nunca aumente o disjuntor sem confirmar a seção e as proteções.</p></div>`;let m=r.matched;return `<section class="result" id="result"><div class="result-head">${ic('check')} Pré-dimensionamento calculado</div><div class="result-main"><div class="kpi"><span>Corrente estimada (Ib)</span><b>${fmt(r.ib,2)} <small style="font-size:13px">A</small></b></div><div class="kpi"><span>Disjuntor nominal preliminar</span><b class="gold">${m.breaker} <small style="font-size:13px">A</small></b></div><div class="kpi"><span>Seção preliminar do cabo</span><b class="green">${fmt(m.section, m.section%1?1:0)} <small style="font-size:13px">mm²</small></b></div><div class="kpi"><span>Queda de tensão resistiva</span><b>${fmt(m.drop.pct,2)}<small style="font-size:13px">%</small></b></div></div><div class="result-details"><div class="detail-line"><span>Capacidade de referência</span><strong>${fmt(m.izRef,1)} A</strong></div><div class="detail-line"><span>Capacidade corrigida (Iz)</span><strong>${fmt(m.iz,1)} A</strong></div><div class="detail-line"><span>Critério básico</span><strong>Ib ≤ In ≤ Iz</strong></div><div class="detail-line"><span>Queda de tensão estimada</span><strong>${fmt(m.drop.volts,2)} V (máx. 4% no circuito terminal)</strong></div><div class="detail-line"><span>Condutores carregados</span><strong>${r.loaded}</strong></div></div><div class="buttons"><button class="primary" type="button" data-action="save-circuit">${ic('save')} Salvar cálculo</button><button class="secondary" type="button" data-action="result-quote">${ic('add')} Levar ao orçamento</button></div></section><div class="warning"><strong>Atenção técnica:</strong> Resultado preliminar com tabela simplificada B1, cabo de cobre PVC 70 °C e queda resistiva aproximada. <strong>Não define automaticamente curva, número de polos, Icn, DR ou DPS.</strong> Confira curto-circuito, seletividade, proteção contra choque, condutor PE/neutro, fatores reais e instruções do fabricante antes de instalar. ${r.profile==='Industrial'?'Em instalações industriais, motores, harmônicos e partidas exigem análise específica.':''}</div>`;}
function cablePage(){const c=state.cable;return `${title('Seção de cabos','Estimativa somente por capacidade de corrente')}<div class="surface"><form id="cableForm"><div class="grid-form">${fld('Corrente de projeto (A)','current',c.current,{type:'number',attr:'data-model="cable" step="any" min="0.1" required'})}${fld('Condutores carregados','loaded',c.loaded,{attr:'data-model="cable"',options:[['2','2 condutores'],['3','3 condutores']]})}${fld('Aplicação','kind',c.kind,{full:true,attr:'data-model="cable"',options:[['iluminacao','Iluminação'],['tomadas','Tomadas / força'],['equipamento','Equipamento dedicado']]})}${fld('Fator de temperatura','temp',c.temp,{type:'number',attr:'data-model="cable" min="0.1" max="1" step="0.01" required'})}${fld('Fator de agrupamento','group',c.group,{type:'number',attr:'data-model="cable" min="0.1" max="1" step="0.01" required'})}</div><p class="hint">Premissas: cobre, PVC 70 °C, método B1. Confirme método e correções com as condições reais da obra.</p><div class="form-actions"><button class="primary" type="submit">${ic('cable')} Consultar seção</button></div></form></div>${latestCable?renderCableResult(latestCable):''}`;}
function calcCable(c){const I=num(c.current),temp=num(c.temp),group=num(c.group),n=Number(c.loaded);if(!Number.isFinite(I)||I<=0||!validateFactors(temp,group)||![2,3].includes(n))return {error:'Informe corrente e fatores válidos (maiores que 0 e até 1).'};let min=c.kind==='iluminacao'?1.5:2.5;let m=null;for(let s of SECTIONS.filter(s=>s>=min)){let iz=getAmp(s,n)*temp*group,br=standardBreaker(I,iz);if(iz>=I&&br){m={section:s,iz,br};break;}}return {type:'cable',I,matched:m,loaded:n,inputs:copy(c)};}
function renderCableResult(r){if(r.error)return `<div class="bad-card">${safe(r.error)}</div>`;if(!r.matched)return `<div class="bad-card">Sem seção compatível na tabela simplificada. Faça estudo técnico específico.</div>`;return `<div class="result"><div class="result-head">${ic('check')} Consulta de seção concluída</div><div class="result-main"><div class="kpi"><span>Seção preliminar</span><b class="green">${fmt(r.matched.section,r.matched.section%1?1:0)} mm²</b></div><div class="kpi"><span>Iz corrigida</span><b>${fmt(r.matched.iz,1)} A</b></div></div><p class="hint" style="color:#c4d7cb">Faixa nominal preliminar do disjuntor: ${r.matched.br} A, sujeita a verificação técnica.</p></div><div class="warning">A seção foi analisada <strong>somente por corrente e proteção básica</strong>. Queda de tensão, curto-circuito, choques, métodos reais, PE e neutro devem ser analisados separadamente.</div>`;}
function dropPage(){const c=state.drop;return `${title('Queda de tensão','Estimativa pelo modelo resistivo')}<div class="surface"><form id="dropForm"><div class="grid-form">${fld('Corrente (A)','current',c.current,{type:'number',attr:'data-model="drop" step="any" min="0.1" required'})}${fld('Tensão (V)','voltage',c.voltage,{type:'number',attr:'data-model="drop" step="any" min="1" required'})}${fld('Comprimento de ida (m)','length',c.length,{type:'number',attr:'data-model="drop" step="any" min="0.1" required'})}${fld('Seção do cobre (mm²)','section',c.section,{options:SECTIONS.map(s=>[String(s),String(s).replace('.',',')+' mm²']),attr:'data-model="drop"'})}${fld('Sistema','phase',c.phase,{full:true,options:[['mono','Monofásico / F+N'],['bi','Bifásico / F+F'],['tri','Trifásico equilibrado / 3F']],attr:'data-model="drop"'})}</div><div class="form-actions"><button class="primary" type="submit">${ic('drop')} Verificar queda</button></div></form></div>${latestDrop?renderDropResult(latestDrop):''}`;}
function calcDrop(c){let I=num(c.current),V=num(c.voltage),L=num(c.length),S=num(c.section);if(![I,V,L,S].every(Number.isFinite)||Math.min(I,V,L,S)<=0||!SECTIONS.includes(S))return {error:'Confira corrente, tensão, seção e distância informadas.'};const d=dropFor(I,V,L,S,c.phase);return {type:'drop',drop:d,pass:d.pct<=4,inputs:copy(c)};}
function renderDropResult(r){if(r.error)return `<div class="bad-card">${safe(r.error)}</div>`;return `<div class="result" style="${r.pass?'':'border-color:#83572b;background:#282116'}"><div class="result-head" style="${r.pass?'':'color:#ffce83'}">${ic(r.pass?'check':'alert')} ${r.pass?'Dentro do limite referencial de 4%':'Acima de 4% — rever dimensionamento'}</div><div class="result-main"><div class="kpi"><span>Queda de tensão</span><b>${fmt(r.drop.pct,2)}%</b></div><div class="kpi"><span>Queda em volts</span><b>${fmt(r.drop.volts,2)} V</b></div></div></div><div class="warning">Estimativa resistiva: cobre com resistividade aproximada de 0,0225 Ω·mm²/m; sem reatância, conexões ou variações de temperatura. O limite de 4% aqui é referência para circuitos terminais — verifique o limite total aplicável ao ponto de uso e o tipo de instalação.</div>`;}
function protectionsPage(){const notes=[['shield','Disjuntor termomagnético','A corrente nominal deve ser compatível com a carga e a capacidade corrigida do condutor. Verifique a capacidade de interrupção, a curva de disparo, a quantidade de polos e a corrente de curto-circuito presumida.'],['shield','DR (dispositivo diferencial residual)','Avalie sensibilidade, tipo AC/A/F/B, seletividade e circuitos de aplicação conforme as cargas e a norma. DR não substitui disjuntor contra sobrecorrente.'],['bolt','DPS (proteção contra surtos)','Seleção depende do esquema de aterramento, classe/tipo, tensão máxima contínua, Iimp/In/Imax, coordenação e proteção de retaguarda; seguir o fabricante.'],['cable','Aterramento e PE','Dimensione e verifique condutor de proteção, continuidade, equipotencialização e seccionamento automático. Não una neutro e terra indevidamente nos circuitos finais.'],['info','Atenção a instalações industriais','Motores, cargas não lineares, harmônicas, seletividade, corrente de partida e proteção contra arco/curto exigem estudos além deste MVP.']];return `${title('Disjuntores e proteções','Guia rápido para seleção responsável')}<div class="surface">${notes.map(n=>`<div class="note-row"><div class="note-icon">${ic(n[0])}</div><div><h3>${n[1]}</h3><p>${n[2]}</p></div></div>`).join('')}</div><div style="margin-top:14px">${info('Não existe recomendação universal de curva C, DR ou DPS apenas com potência e tensão. A versão beta evita defini-los automaticamente.','neutral')}</div>`;}
function quotePage(){const q=state.quote;return `${title('Orçamento profissional','Cadastre itens e gere um PDF para o cliente')}<div class="surface"><h3>Dados do orçamento</h3><div class="grid-form">${fld('Seu nome ou empresa','professional',q.professional,{full:true,attr:'data-model="quote" maxlength="100"',placeholder:'Ex.: Silva Instalações Elétricas'})}${fld('Cliente','client',q.client,{attr:'data-model="quote" maxlength="100"',placeholder:'Nome do cliente'})}${fld('Contato','contact',q.contact,{attr:'data-model="quote" maxlength="80"',placeholder:'Telefone / e-mail'})}${fld('Local da obra','location',q.location,{full:true,attr:'data-model="quote" maxlength="200"',placeholder:'Endereço ou referência'})}</div></div><div class="surface"><h3>Adicionar material ou serviço</h3><form id="itemForm"><div class="grid-form">${fld('Descrição','description','',{full:true,attr:'required maxlength="120"',placeholder:'Ex.: Cabo 4 mm²'})}${fld('Categoria','category','material',{options:[['material','Material'],['servico','Mão de obra']]})}${fld('Unidade','unit','un',{options:[['un','un'],['m','metro'],['h','hora'],['serv','serviço'],['ponto','ponto']]})}${fld('Quantidade','quantity','1',{type:'number',attr:'required min="0.01" step="any"'})}${fld('Preço unitário (R$)','price','0',{type:'number',attr:'required min="0" step="0.01"'})}</div><div class="form-actions"><button type="submit" class="primary">${ic('add')} Adicionar ao orçamento</button></div></form></div><div class="surface"><div class="row-between"><h3>Itens (${q.items.length})</h3>${q.items.length?`<button type="button" class="ghost" data-action="clear-quote">Limpar itens</button>`:''}</div>${q.items.length?q.items.map(it=>`<div class="quote-line"><div><button class="ghost" style="font-size:12px;color:var(--txt);font-weight:800;padding:0;text-align:left;display:inline;text-decoration:underline;text-decoration-color:#5c6468;text-underline-offset:3px" type="button" data-edit-item="${safe(it.id)}" title="Editar item">${safe(it.description)} ✎</button><small>${it.category==='material'?'Material':'Mão de obra'} · ${safe(it.unit)}</small></div><span>${fmt(it.quantity, it.quantity%1?2:0)}</span><span>${money(it.quantity*it.price)}</span><button class="quote-delete" type="button" data-remove-item="${safe(it.id)}" aria-label="Excluir item">${ic('trash')}</button></div>`).join(''):`<div class="empty" style="padding:22px"><span class="large">📄</span>Seu orçamento ainda não possui itens.</div>`}<div class="detail-line"><span>Materiais</span><strong>${money(sumType('material'))}</strong></div><div class="detail-line"><span>Mão de obra</span><strong>${money(sumType('servico'))}</strong></div><div class="quote-total"><span>Total do orçamento</span><strong>${money(totalQuote())}</strong></div></div><div class="surface"><div class="grid-form">${fld('Observações / condições','notes',q.notes,{textarea:true,full:true,attr:'data-model="quote" maxlength="800"'})}</div><div class="form-actions"><button type="button" class="primary" data-action="print-quote">${ic('printer')} Gerar PDF / Imprimir</button></div><p class="hint">Ao tocar em “Gerar PDF”, escolha “Salvar como PDF” nas opções de impressão/compartilhamento do navegador. O PDF não exige servidor.</p></div>`;}
function sumType(t){return state.quote.items.filter(x=>x.category===t).reduce((s,x)=>s+x.quantity*x.price,0);}
function totalQuote(){return state.quote.items.reduce((s,x)=>s+x.quantity*x.price,0);}
function historyPage(){return `${title('Histórico','Cálculos armazenados neste aparelho')}<div class="row-between" style="margin-bottom:13px"><span class="sub">${state.history.length} registro(s)</span><button class="secondary" data-action="export" type="button">${ic('download')} Backup</button></div>${state.history.length?state.history.map((r,i)=>`<div class="history-card"><div><strong>${safe(r.inputs?.name||'Circuito sem nome')}</strong><span>${new Date(r.date).toLocaleString('pt-BR')} · ${safe(r.profile||'')}</span><b>${fmt(r.ib,2)} A · ${fmt(r.matched?.section||0,1)} mm² · ${r.matched?.breaker||'?'} A</b></div><div class="history-actions"><button class="tiny-btn" type="button" data-open-history="${i}">Abrir</button><button class="tiny-btn danger" type="button" data-delete-history="${i}" aria-label="Excluir">${ic('trash')}</button></div></div>`).join(''):`<div class="empty"><span class="large">🕒</span><h3>Seus cálculos aparecerão aqui</h3><p class="sub">Faça um dimensionamento e toque em “Salvar cálculo”.</p><button class="primary" type="button" data-go="circuit">Fazer primeiro cálculo</button></div>`}`;}
function settingsPage(){return `${title('Configurações e dados','Backup e informações desta versão')}<div class="surface"><h3>Seus dados</h3><p class="sub">Histórico e orçamento são salvos <strong>neste navegador/aparelho</strong>. Eles não sincronizam com outros celulares e podem ser apagados ao limpar os dados do navegador.</p><div class="form-actions"><button class="secondary" data-action="export" type="button">${ic('download')} Exportar backup JSON</button><button class="secondary" data-action="import" type="button">Importar backup</button></div></div><div class="surface"><h3>Sobre o EletriPro Beta 1.0</h3><p class="sub">Aplicativo web instalável (PWA) para celular, com funcionamento básico offline depois da primeira visita. Não inclui login, pagamento, nuvem, atualização automática de normas ou garantia de conformidade técnica.</p><p class="sub">Os cálculos utilizam hipóteses simplificadas para estudo e pré-dimensionamento. Um profissional habilitado deve validar o projeto e a instalação conforme ABNT NBR 5410, NR-10, requisitos locais e fabricantes.</p></div><div style="margin-top:16px">${info('Para vender com assinaturas, controle de licenças ou histórico sincronizado, será necessário implementar autenticação e backend seguro. GitHub Pages sozinho hospeda apenas a interface estática.','neutral')}</div>`;}
function render(){renderNav();const views={home,circuit:circuitPage,cable:cablePage,drop:dropPage,protections:protectionsPage,quote:quotePage,history:historyPage,settings:settingsPage};document.getElementById('screen').innerHTML=(views[page]||home)();}
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'instant'});}
function saveCircuit(){if(!latest||latest.error||!latest.matched){toast('Faça um cálculo válido antes de salvar.');return;}state.history.unshift(copy(latest));state.history=state.history.slice(0,70);persist();toast('Cálculo salvo no histórico.');}
function addCircuitToQuote(){if(!latest||!latest.matched){toast('Calcule um circuito antes de continuar.');return;}let item={id:String(Date.now())+String(Math.floor(Math.random()*10000)),description:`Pré-dimensionamento: ${latest.inputs.name||'circuito'} (cabo ${latest.matched.section} mm², DJ ${latest.matched.breaker} A)`,category:'servico',unit:'serv',quantity:1,price:0};state.quote.items.push(item);persist();navigate('quote');toast('Item adicionado. Defina o preço no orçamento.');}
function printQuote(){let q=state.quote;if(!q.items.length){toast('Adicione pelo menos um item ao orçamento.');return;}let date=new Date().toLocaleDateString('pt-BR');let html=`<div class="ps-head"><div style="font-size:14px;color:#7b620e;font-weight:800">⚡ EletriPro</div><h1>ORÇAMENTO DE SERVIÇOS ELÉTRICOS</h1><div style="font-size:10pt">Emitido em ${date}</div></div><div class="ps-meta"><div><strong>PRESTADOR</strong><div>${safe(q.professional||'Não informado')}</div></div><div><strong>CLIENTE</strong><div>${safe(q.client||'Não informado')}</div><div>${safe(q.contact)}</div><div>${safe(q.location)}</div></div></div><table class="ps-table"><thead><tr><th>Descrição</th><th>Tipo</th><th>Qtd.</th><th>Unid.</th><th>Preço</th><th>Subtotal</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${safe(i.description)}</td><td>${i.category==='material'?'Material':'Mão de obra'}</td><td>${fmt(i.quantity,2)}</td><td>${safe(i.unit)}</td><td>${money(i.price)}</td><td>${money(i.price*i.quantity)}</td></tr>`).join('')}</tbody></table><div style="text-align:right;margin-top:15px;font-size:10pt">Materiais: <strong>${money(sumType('material'))}</strong><br>Mão de obra: <strong>${money(sumType('servico'))}</strong></div><div class="ps-total">TOTAL: ${money(totalQuote())}</div><div class="ps-foot"><strong>Observações:</strong><p style="white-space:pre-wrap">${safe(q.notes||'Sem observações.')}</p><p>Orçamento comercial. Dimensionamentos elétricos devem ser confirmados tecnicamente antes da execução.</p></div>`;document.getElementById('printSheet').innerHTML=html;window.print();}
function exportBackup(){let blob=new Blob([JSON.stringify({app:'EletriPro',version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EletriPro_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);toast('Backup exportado. Guarde o arquivo em local seguro.');}
function handleClick(e){const node=e.target.closest('[data-go],[data-profile],[data-action],[data-remove-item],[data-open-history],[data-delete-history],[data-edit-item]');if(!node)return;
 if(node.dataset.go){navigate(node.dataset.go);return;}
 if(node.dataset.profile){state.profile=node.dataset.profile;persist();render();return;}
 if(node.dataset.removeItem){state.quote.items=state.quote.items.filter(i=>i.id!==node.dataset.removeItem);persist();render();return;}
 if(node.dataset.editItem){const it=state.quote.items.find(i=>i.id===node.dataset.editItem);if(!it)return;const q=prompt('Quantidade:',String(it.quantity));if(q===null)return;const price=prompt('Preço unitário (R$):',String(it.price));if(price===null)return;const qt=num(q),pr=num(price);if(!Number.isFinite(qt)||qt<=0||!Number.isFinite(pr)||pr<0){toast('Quantidade ou preço inválido.');return;}it.quantity=qt;it.price=pr;persist();render();return;}
 if(node.dataset.openHistory!==undefined){const r=state.history[Number(node.dataset.openHistory)];if(r){state.circuit={...DEFAULTS.circuit,...r.inputs};state.profile=r.profile||state.profile;latest=copy(r);persist();navigate('circuit');}return;}
 if(node.dataset.deleteHistory!==undefined){if(!confirm('Excluir este cálculo salvo?'))return;state.history.splice(Number(node.dataset.deleteHistory),1);persist();render();return;}
 const a=node.dataset.action;if(a==='save-circuit')saveCircuit();if(a==='result-quote')addCircuitToQuote();if(a==='export')exportBackup();if(a==='import')document.getElementById('importBackup').click();if(a==='print-quote')printQuote();if(a==='clear-quote'){if(confirm('Remover todos os itens do orçamento?')){state.quote.items=[];persist();render();}}}
function submitForm(e){if(!['circuitForm','cableForm','dropForm','itemForm'].includes(e.target.id))return;e.preventDefault();const f=e.target;
 if(f.id==='circuitForm'){latest=calcCircuit(state.circuit);render();if(!latest.error)document.querySelector('#result')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(f.id==='cableForm'){latestCable=calcCable(state.cable);render();return;}
 if(f.id==='dropForm'){latestDrop=calcDrop(state.drop);render();return;}
 if(f.id==='itemForm'){let d=Object.fromEntries(new FormData(f));const quantity=num(d.quantity),price=num(d.price);if(!String(d.description||'').trim()||!Number.isFinite(quantity)||!Number.isFinite(price)||quantity<=0||price<0||quantity>100000||price>100000000){toast('Confira a descrição, quantidade e valor.');return;}state.quote.items.push({id:String(Date.now())+Math.random().toString(36).slice(2),description:d.description.trim(),category:d.category==='servico'?'servico':'material',unit:d.unit,quantity,price});persist();render();toast('Item adicionado ao orçamento.');}}
function updateField(e){const el=e.target;let group=el.dataset.model;if(!group||!state[group])return;state[group][el.name]=el.value;
if(group==='circuit'&&latest){latest=null;const result=document.getElementById('result');if(result){if(result.nextElementSibling?.classList.contains('warning'))result.nextElementSibling.remove();result.remove();}}
if(group==='cable'&&latestCable){latestCable=null;document.querySelector('.result')?.remove();}
if(group==='drop'&&latestDrop){latestDrop=null;document.querySelector('.result')?.remove();}
persist();}
function importBackup(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>2000000){toast('Arquivo muito grande para um backup EletriPro.');return;}const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(raw.app!=='EletriPro'||!raw.state||!Array.isArray(raw.state.history)||!Array.isArray(raw.state.quote?.items))throw Error();if(!confirm('Importar backup e substituir histórico, orçamento e formulários atuais?'))return;let data=raw.state;
// Limit data size and normalize untrusted backup before displaying.
state={...copy(DEFAULTS),profile:['Residencial','Comercial','Industrial'].includes(data.profile)?data.profile:'Residencial',circuit:{...DEFAULTS.circuit,...(data.circuit||{})},cable:{...DEFAULTS.cable,...(data.cable||{})},drop:{...DEFAULTS.drop,...(data.drop||{})},quote:{...DEFAULTS.quote,...(data.quote||{}),items:data.quote.items.slice(0,500).filter(i=>i&&typeof i==='object').map(i=>({id:String(i.id||Date.now()),description:String(i.description||'').slice(0,120),unit:String(i.unit||'un').slice(0,16),category:i.category==='servico'?'servico':'material',quantity:Number.isFinite(num(i.quantity))&&num(i.quantity)>0?num(i.quantity):1,price:Number.isFinite(num(i.price))&&num(i.price)>=0?num(i.price):0}))},history:data.history.slice(0,70).filter(i=>i&&i.type==='circuit'&&i.inputs&&i.matched)};latest=null;latestCable=null;latestDrop=null;persist();navigate('home');toast('Backup importado com sucesso.');}catch{toast('Arquivo de backup inválido.');}};reader.readAsText(file);}
document.addEventListener('click',handleClick);
document.addEventListener('submit',submitForm);
document.addEventListener('input',updateField);
document.addEventListener('change',updateField);
document.getElementById('importBackup').addEventListener('change',importBackup);
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
